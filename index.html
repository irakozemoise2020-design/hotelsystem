<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hotel"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Hotel</title>

<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#14213d;--mute:#5b6b82;--line:#dfe5ee;--navy:#0b2545;--navy2:#1b4f8a;--acc:#0f766e;--acc2:#0b5c56;--bad:#b91c1c;--warn:#b45309;--ok:#15803d;--blue:#1d4ed8}
@media (prefers-color-scheme:dark){:root{--bg:#0e1624;--card:#16213a;--text:#e8eefb;--mute:#9db0cc;--line:#26365a;--navy:#0a1730;--navy2:#16325e;--acc:#2dd4bf;--acc2:#5eead4;--bad:#f87171;--warn:#fbbf24;--ok:#4ade80;--blue:#7aa2f7}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:flex;flex-direction:column;height:100vh}
header{background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:18px}header small{opacity:.8}
.main{display:flex;flex:1;min-height:0}
nav{width:210px;background:var(--card);border-right:1px solid var(--line);padding:10px 8px;overflow:auto;flex:none}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--text);margin-bottom:2px}
nav button:hover{background:var(--bg)}nav button.on{background:var(--acc);color:#fff;font-weight:600}
.page{flex:1;overflow:auto;padding:16px 18px 40px}
.page h2{margin:0 0 12px;font-size:20px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}.btn.primary:hover{background:var(--acc2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.small{padding:3px 9px;font-size:13px}
header .btn{background:transparent;color:#fff;border-color:#ffffff88}header .btn:hover{background:#ffffff22}
.btn[disabled]{opacity:.5;cursor:default}
input,select,textarea{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi span{color:var(--mute);font-size:13px}.kpi b{display:block;font-size:22px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;overflow:auto}.card h3{margin:0 0 8px;font-size:15px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right}tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
tr.sel td{background:var(--line)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line);color:var(--text)}
.pill.RESERVED,.pill.PENDING,.pill.OPEN{background:#fef3c7;color:#92400e}.pill.CHECKED_IN,.pill.OCCUPIED{background:#dbeafe;color:#1e40af}
.pill.CHECKED_OUT,.pill.DONE,.pill.RESOLVED,.pill.AVAILABLE{background:#dcfce7;color:#166534}.pill.CANCELLED,.pill.OUT_OF_ORDER,.pill.URGENT,.pill.HIGH{background:#fee2e2;color:#991b1b}.pill.DIRTY{background:#ffedd5;color:#9a3412}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cal{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}.cal table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:13px}.cal th,.cal td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;height:34px;min-width:44px;text-align:center}.cal th.cr{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;padding:4px 8px;min-width:112px;font-weight:400}.cal th.cd{padding:3px 2px;background:var(--card);font-weight:400;line-height:1.1}.cal th.cd small{display:block;color:var(--mute);font-size:10px}.cal th.cd.we,.cal td.ce.we{background:rgba(0,0,0,.03)}.cal .today{background:rgba(59,130,246,.12)}.cal td.ce{cursor:pointer}.cal td.ce:hover{background:rgba(34,197,94,.18)}.cal td.cb{cursor:pointer;color:#0b2545;font-weight:600;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;border-radius:6px}.cal td.cb.res{background:#bfdbfe}.cal td.cb.in{background:#bbf7d0}.cal td.cb.over{background:#fecaca}.cal tr.ooo th.cr{background:#fee2e2}.cal tr.sum td,.cal tr.sum th{background:rgba(0,0,0,.03);height:28px}.cal td.full{color:#b42318;font-weight:700}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}.lg i.res{background:#bfdbfe}.lg i.in{background:#bbf7d0}.lg i.over{background:#fecaca}
.room{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);cursor:pointer}.room b{font-size:20px}.room small{display:block;color:var(--mute)}
.room.AVAILABLE{border-color:#22c55e}.room.OCCUPIED{border-color:#3b82f6}.room.DIRTY{border-color:#f97316}.room.OUT_OF_ORDER{border-color:#ef4444;opacity:.85}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:8px;cursor:pointer}.tabs button.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.hint{color:var(--mute);font-size:13px}.err{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:99}
#toast div{background:#1f2937;color:#fff;padding:10px 16px;border-radius:10px;margin-top:8px;box-shadow:0 4px 14px #0005;max-width:90vw}#toast div.bad{background:#b91c1c}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;overflow:auto;z-index:50}
.modal{background:var(--card);border-radius:14px;width:min(900px,100%);padding:16px 18px;box-shadow:0 10px 40px #0006}
.modal.narrow{width:min(520px,100%)}.modal.wide{width:min(1100px,100%)}
.modal h3{margin:0 0 10px;font-size:18px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.f{display:grid;grid-template-columns:170px 1fr;gap:8px 10px;align-items:center}.f label{color:var(--mute);font-size:13px}
.login{max-width:380px;margin:8vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}.login input{width:100%;margin:4px 0 12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
#printArea{display:none}
.member-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 12px}
.member-form label{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
.member-form input,.member-form select{width:100%}
.badge{display:inline-block;background:var(--line);color:var(--mute);padding:1px 8px;border-radius:99px;font-size:12px;margin-left:6px}
.kind-COUPLE{background:#ede9fe;color:#5b21b6}.kind-FAMILY{background:#ecfeff;color:#155e75}.kind-GROUP{background:#fef9c3;color:#854d0e}
.acc-group{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.acc-group h4{margin:0 0 8px;font-size:13px;color:var(--navy2);text-transform:uppercase;letter-spacing:.4px}
.acc-group label{display:block;padding:4px 0;font-size:13px;cursor:pointer}
.acc-group input[type=checkbox]{margin-right:8px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* Chat styles */
.chat-wrap{display:grid;grid-template-columns:280px 1fr;gap:12px;height:calc(100vh - 180px);min-height:400px}
.chat-convs{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto;padding:6px;display:flex;flex-direction:column}
.chat-convs-list{flex:1;overflow:auto}
.chat-conv{padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.chat-conv:hover{background:var(--bg)}
.chat-conv.on{background:#dbeafe;border-color:#bfdbfe}
.chat-conv .name{font-weight:600}
.chat-conv .when{color:var(--mute);font-size:11px;float:right}
.chat-conv .last{color:var(--mute);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-conv .unread{background:#16a34a;color:#fff;border-radius:99px;padding:0 7px;font-size:11px;font-weight:600;float:right;margin-left:6px}
.chat-thread-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0}
.chat-header{padding:10px 14px;border-bottom:1px solid var(--line)}
.chat-header .who{font-weight:600;font-size:15px}
.chat-header .sub{color:var(--mute);font-size:12px;margin-top:2px}
.chat-thread{flex:1;overflow:auto;padding:14px;background:#eef2f7;display:flex;flex-direction:column;gap:10px}
.chat-bubble{background:#fff;border-radius:12px;padding:8px 12px;max-width:80%;align-self:flex-start;box-shadow:0 1px 2px #0001;border:1px solid #d1d5db}
.chat-bubble.mine{background:#dcf8c6;align-self:flex-end;border-color:#bbf7d0}
.chat-bubble .meta{font-size:11px;color:#6b7280;margin-bottom:2px}
.chat-bubble.imp{border-left:4px solid #ef4444}
.chat-bubble .file{margin-top:4px;font-size:13px}
.chat-bubble .file a{color:#1d4ed8}
.chat-input-wrap{padding:8px 10px;border-top:1px solid var(--line);background:var(--card);border-radius:0 0 12px 12px}
.chat-input-wrap textarea{width:100%;min-height:60px;resize:vertical}
.chat-files{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chat-file-chip{background:var(--line);padding:3px 8px;border-radius:99px;font-size:12px;display:flex;gap:6px;align-items:center}
.chat-file-chip button{background:none;border:none;color:var(--bad);cursor:pointer;font-weight:600}
#chatDot{position:relative;top:-10px;left:-10px;background:#ef4444;color:#fff;border-radius:99px;padding:0 6px;font-size:11px;font-weight:600}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{display:block;position:absolute;left:0;top:0;width:100%;color:#000;background:#fff;padding:20px}}
@media (max-width:720px){nav{width:100%;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{white-space:nowrap;width:auto}.main{flex-direction:column}.f{grid-template-columns:1fr}.member-form{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.chat-wrap{grid-template-columns:1fr;grid-template-rows:200px 1fr}}

.gl-stage{position:relative;border-radius:22px;padding:18px;overflow:hidden;background:linear-gradient(135deg,#7dd3fc 0%,#a78bfa 48%,#f9a8d4 100%);isolation:isolate}
.gl-stage:before,.gl-stage:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;filter:blur(40px);z-index:-1;opacity:.7;animation:glfloat 14s ease-in-out infinite alternate}
.gl-stage:before{background:#2dd4bf;top:-60px;left:-40px}.gl-stage:after{background:#fbbf24;bottom:-70px;right:-30px;animation-delay:-6s}
@keyframes glfloat{to{transform:translate(40px,30px) scale(1.15)}}
.gl-stage h2,.gl-stage .hint{color:#0b1b3a}
.gl-card,.gl-stage .card{background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.55);box-shadow:0 8px 32px rgba(31,38,135,.18);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);color:#0b1b3a}
.gl-stage .card .card{background:rgba(255,255,255,.35)}
.gl-stage .hint{color:#26365a}
.gl-user,.gl-bot{display:inline-block;border-radius:16px;padding:7px 14px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.6);color:#0b1b3a;animation:glpop .25s ease-out}
.gl-user{background:rgba(27,79,138,.82);color:#fff;text-align:left;max-width:85%}
.gl-bot{background:rgba(255,255,255,.55);max-width:92%}
@keyframes glpop{from{opacity:0;transform:translateY(6px) scale(.97)}}
.gl-stage .btn{background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.7);color:#0b1b3a;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.gl-stage .btn.primary{background:rgba(15,118,110,.9);color:#fff}
.gl-stage input{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);color:#0b1b3a;border-radius:12px}
.gl-stage table,.gl-stage th,.gl-stage td{color:#0b1b3a;background:transparent}
.gl-hello{font-size:1.15em;font-weight:600;margin:0 0 4px;color:#0b1b3a}
.gl-dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#0b1b3a;animation:gldot 1s infinite}.gl-dots i:nth-child(2){animation-delay:.15s}.gl-dots i:nth-child(3){animation-delay:.3s}
@keyframes gldot{50%{opacity:.2;transform:translateY(-4px)}}
.gl-btn{background:linear-gradient(135deg,rgba(125,211,252,.35),rgba(167,139,250,.35));border:1px solid rgba(255,255,255,.55);color:inherit;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(99,102,241,.35)}
header .gl-btn{color:#fff}
@media (prefers-color-scheme:dark){.gl-stage{background:linear-gradient(135deg,#0f2a4a 0%,#2b1b5e 50%,#4a1d4f 100%)}.gl-stage h2,.gl-stage .hint,.gl-hello{color:#e8eefb}.gl-card,.gl-stage .card{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#e8eefb}.gl-bot{background:rgba(255,255,255,.12);color:#e8eefb;border-color:rgba(255,255,255,.2)}.gl-user{background:rgba(20,150,140,.7);color:#fff}.gl-stage .btn{background:rgba(255,255,255,.1);color:#e8eefb;border-color:rgba(255,255,255,.22)}.gl-stage .btn.primary{background:rgba(45,212,191,.85);color:#042f2e}.gl-stage input{background:rgba(255,255,255,.1);color:#e8eefb;border-color:rgba(255,255,255,.25)}.gl-stage table,.gl-stage th,.gl-stage td{color:#e8eefb}.gl-dots i{background:#e8eefb}}
@media (prefers-reduced-motion:reduce){.gl-stage:before,.gl-stage:after,.gl-user,.gl-bot,.gl-dots i{animation:none}}
</style>

<script>

async function pickReturningParty(kind) {
  var parts = await call('searchParties', '', kind);
  if (!parts.length) { toast('No ' + kind.toLowerCase() + 's yet.', true); return null; }
  return new Promise(function (res) {
    var html = '<select id="pick" size="12" style="width:100%">' +
      parts.map(function (p) { return '<option value="' + p.id + '">' + esc(p.group_name + ' (' + p.member_count + ')'); }).join('') + '</select>';
    modal('Pick a returning ' + kind.toLowerCase(), html, [['Cancel', function () { res(null); }], ['Use selected', function (m) {
      var id = +m.querySelector('#pick').value;
      if (!id) return false;
      res(parts.filter(function (x) { return x.id === id; })[0]);
    }, 'primary']], true);
  });
}

function afterSaveOfferAssign(label, isParty, id) {
  if (has('ASSIGN') && confirm(label + '\n\nPut them in a room now?')) goAssign(isParty ? 'party' : 'guest', id);
  else PAGES.registration($('#page'));
}

function renderIndividual(body) {
  body.innerHTML = '<div class="bar"><button class="btn" id="find">Search returning client</button><span class="hint" id="mode">New client</span></div>' +
    '<div class="card">' + memberFormHtml('one', {}) + '</div>' +
    '<div class="bar"><button class="btn primary" id="save">Register client</button><button class="btn" id="clr">Clear</button></div>';
  var m = body.querySelector('.card');
  var editing = 0;
  var f = $('#one_file', m); if (f) f.onchange = function () { attachDoc(m, 'one'); };
  $('#find', body).onclick = function () {
    return act((async function () {
      var g = await pickReturningClient(); if (!g) return;
      loadMember(m, 'one', g);
      editing = g.id;
      $('#mode', body).textContent = 'Returning client (ID ' + g.id + ')';
      $('#save', body).textContent = 'Save updated details';
    })());
  };
  $('#clr', body).onclick = function () { PAGES.registration($('#page')); };
  $('#save', body).onclick = function () {
    return act((async function () {
      await attachDoc(m, 'one');
      var data = readMember(m, 'one');
      if (!data.name) { toast('Full name is required.', true); return; }
      if (editing) { await call('updateClient', editing, data); toast('Client updated.'); }
      else { editing = await call('registerIndividual', data); toast('Client registered.'); }
      afterSaveOfferAssign('Saved: ' + data.name, false, editing);
    })());
  };
}

function renderCouple(body) {
  body.innerHTML = '<div class="bar"><button class="btn" id="find">Search returning couple</button><input id="cname" placeholder="Couple name (optional)" style="min-width:260px"><span class="hint" id="mode">New couple</span></div>' +
    '<div class="two"><div class="card"><h3>Husband</h3>' + memberFormHtml('h', {}) + '</div><div class="card"><h3>Wife</h3>' + memberFormHtml('w', {}) + '</div></div>' +
    '<div class="bar"><button class="btn primary" id="save">Register couple</button><button class="btn" id="clr">Clear</button></div>';
  var hm = body.querySelectorAll('.card')[0], wm = body.querySelectorAll('.card')[1];
  var hId = 0, wId = 0, pid = 0;
  $('#h_file', hm).onchange = function () { attachDoc(hm, 'h'); };
  $('#w_file', wm).onchange = function () { attachDoc(wm, 'w'); };
  $('#find', body).onclick = function () {
    return act((async function () {
      var p = await pickReturningParty('COUPLE'); if (!p) return;
      var mem = await call('groupMembers', p.id);
      if (mem.length < 2) { toast('That couple has fewer than 2 members.', true); return; }
      var h = mem.filter(function (x) { return x.relationship === 'Husband'; })[0] || mem[0];
      var w = mem.filter(function (x) { return x.relationship === 'Wife'; })[0] || mem[1];
      loadMember(hm, 'h', h); loadMember(wm, 'w', w);
      hId = h.id; wId = w.id; pid = p.id;
      $('#cname', body).value = p.group_name; $('#cname', body).disabled = true;
      $('#mode', body).textContent = 'Returning couple (ID ' + p.id + ')';
      $('#save', body).textContent = 'Save updated details';
    })());
  };
  $('#clr', body).onclick = function () { PAGES.registration($('#page')); };
  $('#save', body).onclick = function () {
    return act((async function () {
      await attachDoc(hm, 'h'); await attachDoc(wm, 'w');
      var h = readMember(hm, 'h'), w = readMember(wm, 'w');
      if (!h.name || !w.name) { toast('Both names are required.', true); return; }
      if (pid) { await call('updateCouple', hId, h, wId, w); toast('Couple updated.'); }
      else { pid = await call('registerCouple', $('#cname', body).value, h, w); toast('Couple registered.'); }
      afterSaveOfferAssign('Saved: ' + (h.name + ' & ' + w.name), true, pid);
    })());
  };

function renderParty(body, kind) {
  var word = kind === 'FAMILY' ? 'family' : 'group';
  var isFamily = kind === 'FAMILY';
  body.innerHTML = '<div class="bar"><button class="btn" id="find">Search registered ' + word + '</button><span class="hint" id="mode">New ' + word + '</span></div>' +
    '<div class="card"><h3>' + (isFamily ? 'Family details' : 'Group details') + '</h3><div class="f" style="max-width:640px">' +
      '<label>' + (isFamily ? 'Family name *' : 'Group name *') + '</label><input id="p_name">' +
      '<label>Contact person</label><input id="p_contact">' +
      '<label>Contact phone</label><input id="p_phone">' +
      '<label>Notes</label><input id="p_notes">' +
    '</div></div>' +
    '<div class="card"><h3>Add a member</h3>' + memberFormHtml('m', { family: isFamily }) + '</div>' +
    '<div class="bar"><button class="btn" id="add">Add to list</button><button class="btn" id="edit">Edit selected</button><button class="btn danger" id="remove">Remove selected</button><button class="btn" id="clearForm">Clear form</button></div>' +
    '<div class="card"><h3>Members to register (<span id="cnt">0</span>)</h3><div id="tbl"></div></div>' +
    '<div class="bar"><button class="btn primary" id="save">Register ' + word + '</button></div>';
  var members = [], selectedId = 0, editingIdx = -1;
  var form = body.querySelectorAll('.card')[1];
  var refreshTable = function () {
    var cols = isFamily
      ? [{ h: '#' }, { h: 'Full name' }, { h: 'Relationship' }, { h: 'Date of birth' }, { h: 'Phone' }, { h: 'Document type' }, { h: 'Document no.' }, { h: 'Copy' }]
      : [{ h: '#' }, { h: 'Full name' }, { h: 'Phone' }, { h: 'Email' }, { h: 'Document type' }, { h: 'Document no.' }, { h: 'Nationality' }, { h: 'Copy' }];
    var rows = members.map(function (m, i) {
      return isFamily
        ? [i + 1, m.name, m.relationship, m.birthDate, m.phone, m.docType, m.idNumber, m.doc ? 'yes' : 'no']
        : [i + 1, m.name, m.phone, m.email, m.docType, m.idNumber, m.nationality, m.doc ? 'yes' : 'no'];
    });
    var html = rows.length
      ? '<table><tr>' + cols.map(function (c) { return '<th>' + c.h + '</th>'; }).join('') + '</tr>' +
        rows.map(function (r, i) { return '<tr data-i="' + i + '">' + r.map(function (v) { return '<td>' + esc(v == null ? '' : v) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>'
      : '<p class="hint">No members yet.</p>';
    body.querySelector('#tbl').innerHTML = html;
    body.querySelector('#cnt').textContent = members.length;
    body.querySelectorAll('#tbl tr[data-i]').forEach(function (tr) {
      tr.onclick = function () {
        body.querySelectorAll('#tbl tr[data-i]').forEach(function (x) { x.classList.remove('sel'); });
        tr.classList.add('sel');
        editingIdx = +tr.dataset.i;
      };
    });
  };
  $('#m_file', form).onchange = function () { attachDoc(form, 'm'); };
  $('#add', body).onclick = function () {
    return act((async function () {
      await attachDoc(form, 'm');
      var m = readMember(form, 'm');
      if (!m.name) { toast('Name is required.', true); return; }
      if (editingIdx >= 0) { members[editingIdx] = m; editingIdx = -1; toast('Member updated in the list.'); }
      else { members.push(m); toast('Added ' + m.name + ' to the list.'); }
      clearMember(form, 'm', isFamily);
      refreshTable();
    })());
  };
  $('#edit', body).onclick = function () {
    if (editingIdx < 0) return toast('Select a member in the table first.', true);
    loadMember(form, 'm', members[editingIdx]);
    toast('Edit the fields, then click "Add to list" to save the change.');
  };
  $('#remove', body).onclick = function () {
    if (editingIdx < 0) return toast('Select a member first.', true);
    members.splice(editingIdx, 1); editingIdx = -1; refreshTable();
  };
  $('#clearForm', body).onclick = function () { clearMember(form, 'm', isFamily); editingIdx = -1; };
  $('#find', body).onclick = function () {
    return act((async function () {
      var p = await pickReturningParty(kind); if (!p) return;
      $('#p_name', body).value = p.group_name;
      $('#p_contact', body).value = p.contact_person;
      $('#p_phone', body).value = p.contact_phone;
      $('#p_name', body).disabled = true;
      selectedId = p.id;
      $('#mode', body).textContent = 'Existing ' + word + ' (ID ' + p.id + ') - add new members below.';
      $('#save', body).textContent = 'Add members to ' + word;
    })());
  };
  $('#save', body).onclick = function () {
    return act((async function () {
      if (!members.length) { toast('Add at least one member.', true); return; }
      var name = $('#p_name', body).value.trim();
      if (!name) { toast('Write the ' + word + ' name.', true); return; }
      var pid = await call('registerGroup', selectedId, kind, name,
        $('#p_contact', body).value, $('#p_phone', body).value, $('#p_notes', body).value, members);
      toast(word.charAt(0).toUpperCase() + word.slice(1) + ' saved (' + members.length + ' member' + (members.length === 1 ? '' : 's') + ').');
      afterSaveOfferAssign('Saved: ' + name, true, pid);
    })());
  };
  refreshTable();
}

// ---------- room assignment: people -> room, check-in / check-out of people ----------
var KIND_LABEL = { INDIVIDUAL: 'Individual', COUPLE: 'Couple', FAMILY: 'Family', GROUP: 'Group' };
PAGES.assign = async function (el) {
  var tab = SUB.as_tab = SUB.as_tab || 'assign';
  el.innerHTML = '<h2>Room assignment</h2><div class="tabs"><button data-t="assign" class="' + (tab === 'assign' ? 'on' : '') + '">Put people in a room</button><button data-t="out" class="' + (tab === 'out' ? 'on' : '') + '">In the hotel / check-out</button></div><div id="asBody"></div>';
  el.querySelector('.tabs').onclick = function (e) { var b = e.target.closest('button'); if (b) { SUB.as_tab = b.dataset.t; PAGES.assign(el); } };
  return tab === 'assign' ? assignRooms($('#asBody', el)) : inHouseOut($('#asBody', el));
};
function goAssign(type, id) { SUB.as = { type: type, id: id }; SUB.as_tab = 'assign'; PAGE = 'assign'; draw(); }

async function assignRooms(body) {
  var S = SUB.as || (SUB.as = {}), sel = {}, party = null, rooms = [], picked = null;
  S.from = S.from || TODAY; S.to = S.to && S.to > S.from ? S.to : addDays(S.from, 1);
  body.innerHTML = '<div class="card"><h3>Step 1 - Who? <span class="hint">(search a client, couple, family or group)</span></h3><div class="bar"><input id="aq" placeholder="Name, phone, document no., party name or room" style="min-width:300px"><button class="btn" id="ago">Search</button><span id="who" style="font-weight:600"></span></div><div id="ares"></div><div id="mem"></div></div>' +
    '<div class="card"><h3>Step 2 - Dates and room</h3><div class="bar"><label>Arrival <input type="date" id="afrom"></label><label>Departure <input type="date" id="ato"></label><span class="hint" id="nights"></span></div><div id="rm"></div>' +
    '<div class="bar" style="margin-top:8px"><label>Rate per night <input type="number" id="arate" style="width:120px"></label><label id="cinw"><input type="checkbox" id="acin"> Check in now</label><label>Notes <input id="anote" style="min-width:220px"></label><span style="flex:1"></span><button class="btn primary" id="aok">Assign room</button></div></div>' +
    '<div class="card"><h3>Step 3 - Open stays of this client</h3><div id="stays"><p class="hint">Choose a client above.</p></div></div>';
  $('#afrom', body).value = S.from; $('#ato', body).value = S.to;
  var count = function () { return Object.keys(sel).filter(function (k) { return sel[k]; }).length; };
  var loadRooms = async function () {
    S.from = $('#afrom', body).value; S.to = $('#ato', body).value;
    if (!S.from || !S.to || S.to <= S.from) { $('#rm', body).innerHTML = '<p class="err">Check-out must be after check-in.</p>'; return; }
    $('#nights', body).textContent = Math.round((new Date(S.to) - new Date(S.from)) / 86400000) + ' night(s)';
    $('#cinw', body).style.display = S.from <= TODAY ? '' : 'none'; if (S.from > TODAY) $('#acin', body).checked = false;
    rooms = await call('availableRooms', S.from, S.to);
    if (picked && !rooms.some(function (r) { return r.id === picked.id; })) picked = null;
    drawRooms(); if (party) loadMembers();
  };
  var drawRooms = function () {
    var n = count();
    $('#rm', body).innerHTML = table([{ h: 'Room', f: function (r) { return '<b>' + esc(r.room_number) + '</b>'; } }, { h: 'Type', k: 'room_type' }, { h: 'Rate / night', n: 1, f: function (r) { return num(r.rate); } }, { h: 'Sleeps', n: 1, k: 'capacity' }, { h: 'Now', f: function (r) { return pill(r.status); } },
      { h: '', f: function (r) { return picked && picked.id === r.id ? '<span class="pill CHECKED_IN">SELECTED</span>' : n > r.capacity ? '<span class="hint">too small</span>' : ''; } }], rooms, { click: 1, empty: 'No room is free for these dates.' });
    wireRows($('#rm', body), rooms, function (r) { picked = r; $('#arate', body).value = r.rate; drawRooms(); });
  };
  var loadMembers = async function () {
    var d = await call('partyMembers', party.type, party.id, S.from, S.to), m = d.members;
    $('#who', body).innerHTML = esc(KIND_LABEL[d.kind] || d.kind) + ': ' + esc(d.name) + ' <span class="hint">(' + m.length + ' registered)</span>';
    if (!party.init) { party.init = 1; m.forEach(function (x) { sel[x.id] = d.kind !== 'GROUP' && !x.in_room && !x.blocked; }); }
    m.forEach(function (x) { if (x.in_room) sel[x.id] = false; });
    $('#mem', body).innerHTML = '<div class="bar"><button class="btn small" id="sall">Select everyone not yet in a room</button><button class="btn small" id="snone">Clear</button></div>' +
      table([{ h: '', f: function (x) { return x.in_room || x.blocked ? '' : '<input type="checkbox" data-g="' + x.id + '"' + (sel[x.id] ? ' checked' : '') + '>'; } }, { h: 'Name', f: function (x) { return esc(x.name) + (x.vip ? ' <span class="pill">VIP</span>' : '') + (x.blocked ? ' <span class="pill CANCELLED">DO NOT ACCEPT</span>' : ''); } }, { h: 'Relationship', k: 'relationship' }, { h: 'Born', k: 'birthDate' }, { h: 'Phone', k: 'phone' }, { h: 'Document', f: function (x) { return esc((x.docType ? x.docType + ' ' : '') + (x.idNumber || '')); } },
        { h: 'In room', f: function (x) { return x.in_room ? '<b>' + esc(x.in_room) + '</b> ' + pill(x.stay_status) : '<span class="hint">not in a room</span>'; } }], m);
    var upd = function () { $('#aok', body).textContent = 'Assign room to ' + count() + ' ' + (count() === 1 ? 'person' : 'people'); drawRooms(); };
    $('#mem', body).querySelectorAll('[data-g]').forEach(function (c) { c.onchange = function () { sel[c.dataset.g] = c.checked; upd(); }; });
    $('#sall', body).onclick = function () { m.forEach(function (x) { sel[x.id] = !x.in_room && !x.blocked; }); loadMembers(); };
    $('#snone', body).onclick = function () { m.forEach(function (x) { sel[x.id] = false; }); loadMembers(); };

  };
  var loadStays = async function () {
    var rows = party.type === 'party' ? (await call('partyBill', party.id)).stays : await call('guestHistory', party.id);
    rows = rows.filter(function (r) { return r.status === 'RESERVED' || r.status === 'CHECKED_IN'; });
    var due = rows.filter(function (r) { return r.status === 'RESERVED' && r.check_in <= TODAY; });
    $('#stays', body).innerHTML = table([{ h: '#', f: function (r) { return 'B' + r.id; } }, { h: 'Room', k: 'room_number' }, { h: 'People', k: 'people' }, { h: 'Dates', f: function (r) { return esc(r.check_in + ' > ' + r.check_out); } }, { h: 'Total', n: 1, f: function (r) { return num(r.total); } }, { h: 'Balance', n: 1, f: function (r) { return num(r.balance); } }, { h: 'Status', f: function (r) { return pill(r.status); } },
      { h: '', f: function (r) { return '<div class="acts">' + (r.status === 'RESERVED' && r.check_in <= TODAY ? '<button class="btn small primary" data-ci="' + r.id + '">Check in</button>' : '') + '<button class="btn small" data-fo="' + r.id + '">Open bill</button></div>'; } }], rows, { empty: 'No open stays for this client.' }) +

    if ($('#cia', body)) $('#cia', body).onclick = function () { act(call('checkInMany', due.map(function (r) { return r.id; })).then(reportCheckIn).then(loadRooms)); };

  var choose = function (type, id) { party = { type: type, id: id }; sel = {}; S.type = type; S.id = id; $('#ares', body).innerHTML = ''; loadRooms(); };
  var search = async function () {
    var rows = await call('findParties', $('#aq', body).value);
    $('#ares', body).innerHTML = table([{ h: 'Name', f: function (r) { return esc(r.name) + (r.blocked ? ' <span class="pill CANCELLED">BLOCKED</span>' : ''); } }, { h: 'Type', f: function (r) { return esc(KIND_LABEL[r.kind] || r.kind); } }, { h: 'People', n: 1, k: 'count' }, { h: 'Details', k: 'names' }], rows, { click: 1, empty: 'No match. Register the client first (Registration page).' });
    wireRows($('#ares', body), rows, function (r) { choose(r.type, r.id); });
  };
  $('#ago', body).onclick = search; $('#aq', body).onkeydown = function (e) { if (e.key === 'Enter') search(); };
  $('#afrom', body).onchange = function () { if ($('#ato', body).value <= $('#afrom', body).value) $('#ato', body).value = addDays($('#afrom', body).value, 1); loadRooms(); }; $('#ato', body).onchange = loadRooms;
  $('#aok', body).onclick = async function () {
    if (!party) return toast('Choose who is staying (Step 1).', true);
    var ids = Object.keys(sel).filter(function (k) { return sel[k]; }).map(Number);
    if (!ids.length) return toast('Tick the people who will sleep in the room.', true);
    if (!picked) return toast('Click a room in Step 2.', true);
    var btn = this; btn.disabled = true;
    try {
      var r = await call('assignRoom', { guest_ids: ids, room_id: picked.id, check_in: S.from, check_out: S.to, rate: $('#arate', body).value, check_in_now: $('#acin', body).checked, notes: $('#anote', body).value });
      toast(r.checked_in ? 'Room ' + r.room_number + ' assigned and checked in.' : 'Room ' + r.room_number + ' reserved.');
      picked = null; $('#arate', body).value = ''; $('#acin', body).checked = false; await loadRooms();
    } catch (e) { } finally { btn.disabled = false; }
  };
  if (S.type && S.id) { party = { type: S.type, id: S.id }; try { await loadRooms(); } catch (e) { party = null; } } else await loadRooms();
}
function reportCheckIn(r) {
  if (r.done.length) toast('Checked in: room ' + r.done.join(', ') + '.');
  if (r.failed.length) toast(r.failed.map(function (f) { return 'Room ' + f.room + ': ' + f.reason; }).join('  '), true);
}
function printParty(p) {
  var rows = p.stays.map(function (s) { return '<tr><td>Room ' + esc(s.room_number) + ' (' + esc(s.people) + ')<br><small>' + esc(s.check_in) + ' to ' + esc(s.check_out) + ', ' + s.nights + ' night(s)</small></td><td style="text-align:right">' + num(s.total) + '</td><td style="text-align:right">' + num(s.paid) + '</td><td style="text-align:right">' + num(s.balance) + '</td></tr>'; }).join('');
  $('#printArea').innerHTML = '<h2>' + esc(SET.hotel_name) + '</h2><h3>Combined bill - ' + esc(p.name) + ' (' + esc(KIND_LABEL[p.kind] || p.kind) + ')</h3><table style="width:100%;border-collapse:collapse"><tr><th style="text-align:left">Stay</th><th>Total</th><th>Paid</th><th>Balance</th></tr>' + rows + '<tr><th style="text-align:left">All rooms</th><th style="text-align:right">' + num(p.total) + '</th><th style="text-align:right">' + num(p.paid) + '</th><th style="text-align:right">' + num(p.balance) + '</th></tr></table><p>Printed ' + esc(new Date().toLocaleString()) + ' (' + esc(SET.currency) + ')</p>';
  window.print();
}

async function inHouseOut(body) {
  var picked = {}, rows = [];
  body.innerHTML = '<div class="card" id="arr"></div><div class="card"><h3>People in the hotel now</h3><p class="hint">Tick the people who are leaving and press <b>Check out selected people</b>. A room is closed only when its last person leaves; the others stay on the bill.</p><div class="bar"><input id="hq" placeholder="Filter by name, room, group or phone" style="min-width:280px"><button class="btn small" id="hall">Select everyone listed</button><button class="btn small" id="hnone">Clear</button><span style="flex:1"></span><button class="btn primary" id="hout">Check out selected people</button></div><div id="hl"></div></div>';
  var load = async function () {
    rows = await call('inHousePeople', $('#hq', body).value);
    $('#hl', body).innerHTML = table([{ h: '', f: function (r) { return '<input type="checkbox" data-g="' + r.guest_id + '"' + (picked[r.guest_id] ? ' checked' : '') + '>'; } }, { h: 'Name', k: 'name' }, { h: 'Room', f: function (r) { return '<b>' + esc(r.room) + '</b>'; } }, { h: 'Group / family', k: 'group' }, { h: 'Relationship', k: 'relationship' }, { h: 'Phone', k: 'phone' }, { h: 'Leaves on', k: 'leaves_on' },

    body.querySelectorAll('[data-g]').forEach(function (c) { c.onchange = function () { picked[c.dataset.g] = c.checked; }; });
    body.querySelectorAll('[data-fo]').forEach(function (b) { b.onclick = function () { openFolio(+b.dataset.fo); }; });
  };
